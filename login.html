<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de sesión - Asignación de números de oficio</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="encabezado">
  <h1>Automatizacion de Oficios</h1>
  
</header>
<main class="login">
  <h2>Inicio de sesión</h2>
  <!-- Al conectar con SQL Server: validar usuario y contraseña (RF1) y mandar a la pantalla según el rol -->
  <form id="formLogin" action="solicitar_oficio.html">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" required>
    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena" required>
    <button type="submit" class="boton">Iniciar sesión</button>
  </form>
  <p class="nota">Solo para probar: si el usuario es <b>direccion</b> entra como Secretaría de Dirección; con cualquier otro entra como Secretaría departamental.</p>
</main>
<script>
  // Provisional: se quita cuando exista el inicio de sesión real
  document.getElementById("formLogin").addEventListener("submit", function (e) {
    if (document.getElementById("usuario").value.trim().toLowerCase() === "direccion") {
      e.preventDefault();
      window.location.href = "registro_general.html";
    }
  });
</script>
</body>
</html>
